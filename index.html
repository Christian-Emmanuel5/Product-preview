<!doctype html>
<html lang="en" class="text-rem">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./src/styled.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body
    class="bg-[#f2ebe3] w-full font-Montserrat font-semibold relative flex h-screen flex-col justify-center items-center text-[#6c7289]"
  >
    <main
      class="bg-white rounded-2xl flex flex-col items-center w-(--w-dynamic) md:grid md:grid-cols-2"
    >
      <picture>
        <source
          srcset="./images/image-product-desktop.jpg"
          media="(min-width: 550px)"
        />
        <img
          class="rounded-t-2xl md:rounded-l-2xl md:rounded-t-none"
          alt="A glass bottle of perfume"
          src="./images/image-product-mobile.jpg"
        />
      </picture>

      <section
        class="p-[1.8rem] flex flex-col md:p-[1.6rem] md:gap-[0.5rem] justify-around gap-[1rem] h-full"
      >
        <h1 class="text-[0.9rem] tracking-[0.3rem]">PERFUME</h1>

        <h2
          class="text-[#1c232b] font-black text-[2.2rem] font-Fraunces leading-none"
        >
          Gabrielle Essence Eau De Parfum
        </h2>

        <p>
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <div class="flex items-center gap gap-3">
          <span class="font-extrabold text-[2rem] text-[#3c8067] font-Fraunces"
            >$149.99</span
          >
          <p class="line-through">$169.99</p>
        </div>

        <button
          type="submit"
          class="bg-[#3c8067] hover:bg-green-700 active:bg-green-700 text-white font-bold p-3 rounded-lg"
        >
          <img class="inline mx-2" src="./images/icon-cart.svg" />Add to Cart
        </button>
      </section>
    </main>

    <footer
      class="text-center fixed bottom-0 md:bg-green-700 w-(--w-dynamic) text-[0.8rem] rounded-full"
    >
      Challenge by
      <a
        class="hover:bg-green-700 underline"
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a
        class="hover:bg-green-700 underline"
        href="https://www.linkedin.co
m/in/christian-akor-759298293?utm_source=share&
utm_campaign=share_via&utm_content=profile&utm_
medium=android_app"
        >Christian</a
      >.
    </footer>
  </body>
</html>
