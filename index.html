<!DOCTYPE html>
<html lang="en" class="text-rem">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link rel="stylesheet" href="./src/styled.css" >
  
  <title>Frontend Mentor | Product preview card component</title>
  
</head>
<body class="bg-cream w-full relative flex h-screen flex-col justify-center items-center">
  
  <main class="bg-white mx-auto rounded-2xl flex flex-col items-center w-(--w-dynamic) gap-3 md:grid md:grid-cols-2 overflow-hidden" >
    
    <picture>
      <source srcset="./images/image-product-desktop.jpg" media="(min-width: 40rem">
      <img class"object-cover" alt="A glass bottle of perfume"
      src="./images/image-product-mobile.jpg" >
    </picture>
    
    <section class="p-8 text-grey flex flex-col gap-4">
      
      <h1 class="tracking-[0.2rem]">PERFUME</h1>
      <h2 class="text-blac font-extrabold text-[2.2rem] font-Fraunces leading-none ">Gabrielle Essence Eau De Parfum</h2>
    
      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
    
      <div class="flex items-center gap 
      gap-3"><span class="font-extrabold text-[2rem] text-green-500 font-Fraunces">$149.99</span>
      <p class="line-through">$169.99</p></div>
    
      <button type="submit" class="bg-green-500 hover:bg-green-700 active:bg-green-700 text-white font-bold p-3 rounded-lg"><img class="inline mx-2" src="./images/icon-cart.svg">Add to Cart</button>
    </section>
  </main>
  
  <footer class="text-center fixed bottom-0 md:bg-white w-(--w-dynamic) text-[0.8rem] rounded-full text-grey">
    
    Challenge by <a class="hover:bg-green-700 underline" href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    
    Coded by <a class="hover:bg-green-700 underline" href="https://www.linkedin.co
m/in/christian-akor-759298293?utm_source=share&
utm_campaign=share_via&utm_content=profile&utm_
medium=android_app">Christian</a>.

  </footer>
  
</body>
</html>
